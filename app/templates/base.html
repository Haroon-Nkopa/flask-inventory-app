<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FIXED: Points to the root manifest route instead of static subfolders -->
  <link rel="manifest" href="/static/manifest.json"  crossorigin="use-credentials">
  <meta name="theme-color" content="#1a2234">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>{% block title %}StockWise{% endblock %}</title>
  
<link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block styles %}{% endblock %}
</head>
<body class="bg-dark text-light">

  <!-- FIXED: Changed to a plain HTML wrapper. JavaScript will safely insert the shop name dynamically -->
  <div id="pwa-shop-header" class="shop-header p-2 bg-secondary text-center d-none">
    🏪 <span id="pwa-shop-name"></span>
  </div>

  <div class="container mt-3">
    <!-- Container for client side alerts when offline -->
    <div id="pwa-alert-container"></div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- FIXED: Complete, functional Bootstrap CDN bundle path -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>

  <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker Registered at scope:', reg.scope))
                .catch(err => console.log('Service Worker Registration Failed:', err));
        });
    }
  </script>

  <script src="{{ url_for('static', filename='js/offline-sync.js') }}"></script>


  {% block scripts %}{% endblock %}
</body>
</html>
