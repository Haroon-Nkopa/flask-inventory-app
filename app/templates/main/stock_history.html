{% extends "base.html" %}

{% block title %}Stock History | StockWise{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>📊 Stock History</h2>
    
    <!-- Data Source Selector and Back Button Wrapper -->
    <div class="d-flex gap-3 align-items-center">
      <div class="input-group">
        <label class="input-group-text bg-dark text-light border-secondary" for="stock-table-select">View:</label>
        <select class="form-select bg-dark text-light border-secondary" id="stock-table-select">
          <option value="live" selected>🟢 Live Stock</option>
          <option value="daily">📅 Daily Snapshots</option>
          <option value="audited">📑 Audited Stock (Physical Counts)</option>
        </select>
      </div>
      <a href="{{ url_for('main.shop') }}" class="btn btn-outline-light text-nowrap">← Back</a>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-dark table-striped table-bordered align-middle">
      <thead id="history-header">
        <!-- JS will inject <tr> with Product and Dates here -->
      </thead>
      <tbody id="history-body">
        <tr><td colspan="100%" class="text-center">Loading stock records...</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
