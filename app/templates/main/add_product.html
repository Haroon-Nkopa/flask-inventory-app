{% extends "base.html" %}

{% block title %}Add Product | StockWise{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="card card-custom">
    <div class="card-header text-center border-secondary">
      <h3>Add New Product</h3>
    </div>
    
    <div class="card-body">
      <!-- Ensure this ID matches what is in your products.js -->
      <form id="addProductForm">

        <!-- 1. Product Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Product Name</label>
          <input type="text" class="form-control" name="name" id="name" required>
        </div>

        <!-- 2. Category -->
        <div class="mb-3">
          <label for="category" class="form-label">Category</label>
          <input type="text" class="form-control" name="category" id="category">
        </div>

        <!-- 3. Price -->
        <div class="mb-3">
          <label for="price" class="form-label">Price (R)</label>
          <input type="number" step="0.01" class="form-control" name="price" id="price" required>
        </div>

        <!-- 4. Size / Weight -->
        <div class="mb-3">
          <label for="size" class="form-label">Size / Weight</label>
          <input type="text" class="form-control" name="size" id="size" placeholder="e.g., 2L, 12-pack, 500g">
        </div>

        <!-- 5. Batch Size -->
        <div class="mb-3">
          <label for="batch_size" class="form-label">Batch Size (Units per Pack)</label>
          <input type="number" class="form-control" name="batch_size" id="batch_size" value="1" min="1">
        </div>

        <!-- 6. Batch Price -->
        <div class="mb-3">
          <label for="batch_price" class="form-label">Batch Price (R)</label>
          <input type="number" step="0.01" class="form-control" name="batch_price" id="batch_price" value="0">
        </div>

        <!-- 7. Threshold -->
        <div class="mb-3">
          <label for="lower_bound" class="form-label">Restock Threshold</label>
          <input type="number" class="form-control" name="lower_bound" id="lower_bound" value="0">
        </div>

        <!-- 8. Batch Number -->
        <div class="mb-3">
          <label for="batch_number" class="form-label">Batch Number</label>
          <input type="text" class="form-control" name="batch_number" id="batch_number">
        </div>

        <button type="submit" class="btn btn-success w-100">Save Product</button>
      </form>
    </div>

    <div class="card-footer text-center border-secondary">
      <a href="{{ url_for('main.shop') }}" class="btn btn-outline-light btn-sm">← Back to Inventory</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
  <!-- Make sure this file exists in app/static/js/products.js -->
  <script src="{{ url_for('static', filename='js/products.js') }}"></script>
{% endblock %}
