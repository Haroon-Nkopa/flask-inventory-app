{% extends "base.html" %}

{% block title %}Add Product | StockWise{% endblock %}

{% block content %}
<div class="container mt-5">
  <!-- Interactive Entry Overlay (Hidden by Default) -->
  <div id="rapidEntryOverlay" class="d-none position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-95 d-flex flex-column align-items-center justify-content-center" style="z-index: 2000;">
    <div id="rapidFieldContainer" class="text-center text-white mb-4 w-75 m-auto">
      <!-- Active input field gets cloned or moved here via JavaScript -->
    </div>
    
    <!-- Large Summary Screen (Hidden until the last field is completed) -->
    <div id="rapidSummaryContainer" class="d-none text-white text-center w-75 m-auto">
      <h2 class="mb-4 text-warning">Review Product Details</h2>
      <div id="summaryDetailsList" class="bg-secondary bg-opacity-25 p-4 rounded text-start mb-4 fs-4 border border-secondary mx-auto" style="max-width: 500px;">
        <!-- Filled fields will display here dynamically -->
      </div>
      <div class="d-flex gap-3 justify-content-center">
        <button type="button" id="rapidCancelBtn" class="btn btn-danger btn-lg px-5">Cancel</button>
        <button type="button" id="rapidSaveBtn" class="btn btn-success btn-lg px-5">Save Product</button>
      </div>
    </div>
  </div>

  <div class="card card-custom">
    <div class="card-header d-flex justify-content-between align-items-center border-secondary py-3">
      <h3 class="mb-0">Add New Product</h3>
      <!-- 1. The Action Button to launch speed-entry mode -->
      <button type="button" id="startRapidModeBtn" class="btn btn-info btn-sm fw-bold">⚡ Add Many Products (Speed Entry)</button>
    </div>
    
    <div class="card-body">
      <form id="addProductForm">

        <!-- Added 'rapid-field' class to targets below for auto-iteration -->
        <!-- 1. Product Name -->
        <div class="mb-3 rapid-field">
          <label for="name" class="form-label">Product Name</label>
          <input type="text" class="form-control form-control-lg-rapid" name="name" id="name" required>
        </div>

        <!-- 2. Category -->
        <div class="mb-3 rapid-field">
          <label for="category" class="form-label">Category</label>
          <input type="text" class="form-control form-control-lg-rapid" name="category" id="category">
        </div>

        <!-- 3. Price -->
        <div class="mb-3 rapid-field">
          <label for="price" class="form-label">Price (R)</label>
          <input type="number" step="0.01" class="form-control form-control-lg-rapid" name="price" id="price" required>
        </div>

        <!-- 4. Size / Weight -->
        <div class="mb-3 rapid-field">
          <label for="size" class="form-label">Size / Weight</label>
          <input type="text" class="form-control form-control-lg-rapid" name="size" id="size" placeholder="e.g., 2L, 12-pack, 500g">
        </div>

        <!-- 5. Batch Size -->
        <div class="mb-3 rapid-field">
          <label for="batch_size" class="form-label">Batch Size (Units per Pack)</label>
          <input type="number" class="form-control form-control-lg-rapid" name="batch_size" id="batch_size" value="1" min="1">
        </div>

        <!-- 6. Batch Price -->
        <div class="mb-3 rapid-field">
          <label for="batch_price" class="form-label">Batch Price (R)</label>
          <input type="number" step="0.01" class="form-control form-control-lg-rapid" name="batch_price" id="batch_price" value="0">
        </div>

        <!-- 7. Threshold -->
        <div class="mb-3 rapid-field">
          <label for="lower_bound" class="form-label">Restock Threshold</label>
          <input type="number" class="form-control form-control-lg-rapid" name="lower_bound" id="lower_bound" value="0">
        </div>

        <!-- 8. Batch Number -->
        <div class="mb-3 rapid-field">
          <label for="batch_number" class="form-label">Batch Number</label>
          <input type="text" class="form-control form-control-lg-rapid" name="batch_number" id="batch_number">
        </div>

        <button type="submit" class="btn btn-success w-100">Save Product</button>
      </form>
    </div>

    <div class="card-footer text-center border-secondary">
      <a href="{{ url_for('main.shop') }}" class="btn btn-outline-light btn-sm">← Back to Inventory</a>
    </div>
  </div>
</div>

<!-- Inject explicit CSS rule for dynamic field scaling style layout -->
<style>
  .rapid-zoomed fieldset, .rapid-zoomed label { font-size: 2.5rem !important; font-weight: bold; color: #ffc107; display: block; margin-bottom: 20px;}
  .rapid-zoomed input { font-size: 3rem !important; padding: 15px !important; text-align: center; border-radius: 10px; background: #fff !important; color: #000 !important;}
</style>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/product.js') }}"></script>
{% endblock %}
