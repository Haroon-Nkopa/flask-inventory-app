<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS - {{ session['shop_name'] }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b1220; color: #f8f9fa; }
    .card { background-color: #1a2234; border: none; border-radius: 12px; }
    .table-dark { --bs-table-bg: #1a2234; }
    .cart-container { position: sticky; top: 20px; max-height: 80vh; overflow-y: auto; }
    .product-row:hover { cursor: pointer; background-color: #2c364c !important; }
    .btn-success { background-color: #198754; border: none; }
  </style>
</head>
<body>

<div class="container-fluid mt-4">
  <!-- Header Section -->
  <div class="d-flex justify-content-between align-items-center mb-4 px-3">
    <h3>🛒 POS Terminal: {{ session['shop_name'] }}</h3>
    <div>
        <a href="{{ url_for('main.shop') }}" class="btn btn-outline-light me-2">Back to Dashboard</a>
        <a href="{{ url_for('main.logout') }}" class="btn btn-danger">Logout</a>
    </div>
  </div>

  <div class="row">
    <!-- Left Side: Product Selection -->
    <div class="col-md-7">
      <div class="card p-3">
        

        <input type="text" id="searchBar" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="🔍 Search product by name or category...">
        
        <table class="table table-dark table-hover align-middle">
          <thead class="table-success text-dark">
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Price</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="productTable">
            {% for p in products %}
            <tr class="product-row" onclick="addToCart('{{ p.id }}', '{{ p.name }}', {{ p.price }})">
              <td><strong>{{ p.name }}</strong></td>
              <td><span class="badge bg-secondary">{{ p.category }}</span></td>
              <td>R {{ "%.2f"|format(p.price) }}</td>
              <td><button class="btn btn-sm btn-success">+</button></td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Right Side: Checkout Cart -->
    <div class="col-md-5">
      <div class="card p-3 cart-container">
        <h4 class="border-bottom pb-2 mb-3">Current Sale</h4>
        <table class="table table-dark">
          <thead>
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>Total</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cartItems">
            <!-- Items added via JS appear here -->
          </tbody>
        </table>
        
        <div class="mt-4 pt-3 border-top">
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal:</span>
            <span id="subtotal">R 0.00</span>
          </div>
          <div class="d-flex justify-content-between fw-bold fs-4">
            <span>Total:</span>
            <span id="grandTotal" class="text-success">R 0.00</span>
          </div>
          <button class="btn btn-lg btn-primary w-100 mt-4" onclick="checkout()">Complete Transaction</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let cart = {};

  // Search Functionality
  document.getElementById('searchBar').addEventListener('keyup', function() {
    let filter = this.value.toLowerCase();
    let rows = document.querySelectorAll('#productTable tr');
    rows.forEach(row => {
      let text = row.innerText.toLowerCase();
      row.style.display = text.includes(filter) ? '' : 'none';
    });
  });

  // Add to Cart
  function addToCart(id, name, price) {
    if (cart[id]) {
      cart[id].qty += 1;
    } else {
      cart[id] = { name: name, price: price, qty: 1 };
    }
    renderCart();
  }

  // Remove from Cart
  function removeFromCart(id) {
    delete cart[id];
    renderCart();
  }

  // Update Cart UI
  function renderCart() {
    const container = document.getElementById('cartItems');
    container.innerHTML = '';
    let total = 0;

    for (let id in cart) {
      let item = cart[id];
      let rowTotal = item.price * item.qty;
      total += rowTotal;

      container.innerHTML += `
        <tr>
          <td>${item.name}</td>
          <td>${item.qty}</td>
          <td>R ${rowTotal.toFixed(2)}</td>
          <td><button class="btn btn-sm btn-outline-danger" onclick="removeFromCart('${id}')">×</button></td>
        </tr>
      `;
    }

    document.getElementById('subtotal').innerText = `R ${total.toFixed(2)}`;
    document.getElementById('grandTotal').innerText = `R ${total.toFixed(2)}`;
  }



  /////
async function checkout() {
  if (Object.keys(cart).length === 0) {
    alert("Cart is empty!");
    return;
  }

  // Convert cart object to a list for the backend
  const orderData = Object.keys(cart).map(id => ({
    product_id: id,
    quantity: cart[id].qty
  }));

  try {
    const response = await fetch("{{ url_for('main.pos') }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items: orderData })
    });

    const result = await response.json();

    if (response.ok) {
      alert("Transaction Successful! Stock updated.");
      cart = {};
      renderCart();
      // Optional: reload page to show updated stock counts if displayed
      // location.reload(); 
    } else {
      alert("Error: " + result.error);
    }
  } catch (error) {
    console.error("Checkout failed:", error);
    alert("Something went wrong with the connection.");
  }
}


/////

</script>


</body>
</html>
