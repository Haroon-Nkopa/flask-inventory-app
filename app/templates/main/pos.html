<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS - {{ session['shop_name'] }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b1220; color: #f8f9fa; min-height: 100vh; }
    .card { background-color: #1a2234; border: none; border-radius: 12px; }
    .table-dark { --bs-table-bg: #1a2234; }
    .cart-container { position: sticky; top: 20px; max-height: 85vh; overflow-y: auto; }
    .product-row:hover { cursor: pointer; background-color: #2c364c !important; }
    .btn-success { background-color: #198754; border: none; }
    .cart-container::-webkit-scrollbar { width: 6px; }
    .cart-container::-webkit-scrollbar-thumb { background: #3c4b6e; border-radius: 10px; }
  </style>
</head>
<body>

<div class="container-fluid mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4 px-3">
    <h3>🛒 POS Terminal: {{ session['shop_name'] }}</h3>
    <div>
        <a href="{{ url_for('main.shop') }}" class="btn btn-outline-light me-2">Back to Dashboard</a>
        <a href="{{ url_for('main.logout') }}" class="btn btn-danger">Logout</a>
    </div>
  </div>

  <div class="row">
    <!-- Left Side: Product Selection -->
    <div class="col-md-7">
      <div class="card p-3 mb-4">
        <input type="text" id="searchBar" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="🔍 Search product by name or category...">
        
        <div class="table-responsive">
          <table class="table table-dark table-hover align-middle">
            <thead class="table-success text-dark">
              <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
                <th class="text-end">Action</th>
              </tr>
            </thead>
            <!-- No more Jinja loop here. JS will fill this. -->
            <tbody id="productTable">
              <tr>
                <td colspan="4" class="text-center py-5">
                  <div class="spinner-border text-success" role="status"></div>
                  <p class="mt-2 text-muted">Loading products...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Right Side: Checkout Cart -->
    <div class="col-md-5">
      <div class="card p-3 cart-container">
        <h4 class="border-bottom pb-2 mb-3">Current Sale</h4>
        <table class="table table-dark">
          <thead>
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>Total</th>
              <th class="text-end"></th>
            </tr>
          </thead>
          <tbody id="cartItems">
            <tr><td colspan="4" class="text-muted text-center py-4">Cart is empty</td></tr>
          </tbody>
        </table>
        
        <div class="mt-auto pt-3 border-top">
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal:</span>
            <span id="subtotal">R 0.00</span>
          </div>
          <div class="d-flex justify-content-between fw-bold fs-4">
            <span>Total:</span>
            <span id="grandTotal" class="text-success">R 0.00</span>
          </div>
          
          <button id="checkoutBtn" class="btn btn-lg btn-primary w-100 mt-4" onclick="checkout()">
            <span id="btnText">Complete Transaction</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Ensure the keys here match what your pos.js expects
  const POS_CONFIG = {
    productsUrl: "{{ url_for('main.get_pos_products') }}",
    checkoutUrl: "{{ url_for('main.pos_checkout_api') }}",
    shopName: "{{ session['shop_name'] }}"
  };
</script>

<script src="{{ url_for('static', filename='js/pos.js') }}"></script>

</body>
</html>
