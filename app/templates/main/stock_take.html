{% extends "base.html" %}

{% block title %}Take Stock | StockWise{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="card card-custom shadow-lg rounded-4">
    <div class="card-header text-center">
      <h3>Take Stock</h3>
    </div>

    <div class="card-body">
      <form id="stockTakeForm">
        <div class="mb-3">
          <label class="form-label fw-bold">Stock Taking Date</label>
          <p class="form-control-plaintext text-light">
            📅 Stock will be recorded for <strong>{{ today.strftime('%A, %d %B %Y') }}</strong>
          </p>
        </div>

        <table class="table table-dark table-striped text-center align-middle">
          <thead class="table-success text-dark">
            <tr>
              <th>Product</th>
              <th>Quantity</th>
            </tr>
          </thead>
          <tbody id="stock-list">
            <tr><td colspan="2">Loading products...</td></tr>
          </tbody>
        </table>

        <button type="submit" class="btn btn-success w-100">Save Stock</button>
      </form>
    </div>
    
    <div class="card-footer text-center">
      <a href="{{ url_for('main.shop') }}" class="btn btn-outline-light btn-sm">← Back to Inventory</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/stock_take.js') }}"></script>
{% endblock %}
