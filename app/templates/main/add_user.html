{% extends "base.html" %}

{% block title %}Add New User - StockWise{% endblock %}

{% block content %}

<div class="container-fluid mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4 px-3">
    <div>
        <a href="{{ url_for('main.shop') }}" class="btn btn-outline-light me-2">Back to Dashboard</a>
       
    </div>
  </div>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card bg-secondary border-0 shadow-lg text-light">
        <div class="card-header bg-dark border-0 py-3 text-center">
          <h4 class="mb-0 fw-bold text-uppercase tracking-wide">Add New User</h4>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('main.add_user') }}" class="needs-validation" novalidate>
            
            <!-- Username Input -->
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username</label>
              <input type="text" 
                     class="form-control bg-dark text-light border-0" 
                     id="username" 
                     name="username" 
                     placeholder="Enter username"
                     required 
                     maxlength="120">
              <div class="invalid-feedback text-warning">Please provide a unique username.</div>
            </div>

            <!-- Password Input -->
            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Password</label>
              <input type="password" 
                     class="form-control bg-dark text-light border-0" 
                     id="password" 
                     name="password" 
                     placeholder="Enter secure password"
                     required>
              <div class="invalid-feedback text-warning">Please enter a password.</div>
            </div>

            <!-- Role Selection -->
            <div class="mb-4">
              <label for="role" class="form-label fw-semibold">System Role</label>
              <select class="form-select bg-dark text-light border-0" id="role" name="role" required>
                <option value="" disabled selected>Choose a role...</option>
                <option value="owner">Owner</option>
                <option value="admin">Admin</option>
                <option value="manager">Manager</option>
                <option value="auditor">Auditor</option>
                <option value="employee">Employee</option>
              </select>
              <div class="invalid-feedback text-warning">Please assign a user role.</div>
            </div>

            <!-- Action Buttons -->
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success fw-bold py-2">Create User</button>
              <a href="javascript:history.back()" class="btn btn-outline-light btn-sm py-2">Cancel</a>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Simple Bootstrap client-side form validation script
  (function () {
    'use strict'
    const forms = document.querySelectorAll('.needs-validation')
    Array.prototype.slice.call(forms).forEach(function (form) {
      form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
          event.preventDefault()
          event.stopPropagation()
        }
        form.classList.add('was-validated')
      }, false)
    })
  })()
</script>
{% endblock %}
