{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
  <div class="card bg-secondary text-light shadow-lg rounded-4 p-3">
    <div class="card-header text-center border-0">
      <h3>Add New Stocks</h3>
    </div>
    <div class="card-body">
      <!-- Store URLs in data attributes so static JS can find them -->
      <form id="addStockForm" 
            data-get-url="{{ url_for('main.get_products_list') }}" 
            data-post-url="{{ url_for('main.add_new_stock_api') }}"
            data-redirect-url="{{ url_for('main.shop') }}">
        
        <div class="mb-4">
          <label for="productSelect" class="form-label">Product</label>
          <select id="productSelect" class="form-select bg-dark text-light border-secondary" required>
            <option value="" selected disabled>Loading products...</option>
          </select>
        </div>

        <div class="mb-4">
          <label for="new_quantity" class="form-label">Quantity to Add</label>
          <input type="number" class="form-control bg-dark text-light border-secondary" id="new_quantity" min="1" required placeholder="e.g. 50">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-success w-100 py-2 fw-bold">Add Stocks</button>
      </form>
    </div>
    <div class="card-footer text-center border-0">
      <a href="{{ url_for('main.shop') }}" class="text-light text-decoration-none">← Back to Inventory</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Link to your new static file -->
<script src="{{ url_for('static', filename='js/new_stock.js') }}"></script>
{% endblock %}
