<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales History - {{ session['shop_name'] }}</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://jsdelivr.net" rel="stylesheet">

  <style>
    body { background-color: #0b1220; color: #f8f9fa; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .card { background-color: #1a2234; border: none; border-radius: 12px; }
    
    /* Custom Accordion Styling */
    .accordion-item {
      background-color: #1a2234;
      border: 1px solid #2c364c;
      margin-bottom: 10px;
      border-radius: 8px !important;
      overflow: hidden;
    }
    .accordion-button {
      background-color: #1a2234 !important;
      color: #ffffff !important;
      box-shadow: none !important;
    }
    .accordion-button:not(.collapsed) {
      background-color: #2c364c !important;
      border-bottom: 1px solid #3d4b6b;
    }
    .accordion-button::after {
      filter: invert(1); /* Makes the arrow white */
    }
    .accordion-button:focus { box-shadow: none; border-color: rgba(255,255,255,.1); }

    .table-dark {
      --bs-table-bg: #1a2234;
      margin-bottom: 0;
    }
    .table { border-collapse: separate; border-spacing: 0 5px; }

    .status-badge {
      font-size: 0.85rem;
      padding: 5px 10px;
      border-radius: 20px;
      background-color: #198754;
    }

    /* Skeleton Loading Animation */
    .skeleton {
      background: #1a2234;
      background: linear-gradient(110deg, #1a2234 8%, #2c364c 18%, #1a2234 33%);
      border-radius: 5px;
      background-size: 200% 100%;
      animation: 1.5s shine linear infinite;
    }
    @keyframes shine {
      to { background-position-x: -200%; }
    }
  </style>
</head>
<body>

<div class="container mt-5">
  <!-- Header Section -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1">🧾 Sales History</h2>
      <p class="text-secondary mb-0">Reviewing all transactions for <strong>{{ session['shop_name'] }}</strong></p>
    </div>
    <div>
      <a href="{{ url_for('main.shop') }}" class="btn btn-outline-light me-2">Back to Dashboard</a>
      <a href="{{ url_for('main.pos') }}" class="btn btn-warning text-dark fw-bold">🛒 Open POS</a>
    </div>
  </div>

  <!-- Sales Accordion Container -->
  <div class="accordion" id="salesAccordion">
    <!-- Initial Loading State (Skeleton) -->
    <div id="loadingState" class="text-center py-5">
      <div class="spinner-border text-success" role="status"></div>
      <p class="mt-2 text-muted">Fetching transaction history...</p>
    </div>
  </div>

  <!-- Footer Info -->
  <p class="text-center text-secondary mt-5 small">
    &copy; <span id="currentYear"></span> {{ session['shop_name'] }} Inventory System
  </p>
</div>

<!-- 1. Configuration Script -->
<script>
  // Bridge Flask data to the external JS file
  const SALES_CONFIG = {
    apiUrl: "{{ url_for('main.get_sales_history_api') }}",
    shopName: "{{ session['shop_name'] }}"
  };
  
  // Set current year
  document.getElementById('currentYear').textContent = new Date().getFullYear();
</script>

<!-- 2. Bootstrap Bundle with Popper -->
<script src="https://jsdelivr.net"></script>

<!-- 3. Your External Logic -->
<script src="{{ url_for('static', filename='js/sales_history.js') }}"></script>

</body>
</html>
