<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales History - {{ session.get('shop_name', 'My Shop') }}</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --bg-dark: #0b1220;
            --card-dark: #1a2234;
            --border-dark: #2c364c;
            --accent-dark: #3d4b6b;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8f9fa;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card-dark);
            border: none;
            border-radius: 12px;
        }

        /* Accordion */
        .accordion-item {
            background-color: var(--card-dark);
            border: 1px solid var(--border-dark);
            margin-bottom: 10px;
            border-radius: 8px !important;
            overflow: hidden;
        }

        .accordion-button {
            background-color: var(--card-dark) !important;
            color: #fff !important;
            box-shadow: none !important;
        }

        .accordion-button:not(.collapsed) {
            background-color: var(--border-dark) !important;
            border-bottom: 1px solid var(--accent-dark);
        }

        .accordion-button::after {
            filter: invert(1);
        }

        .accordion-button:focus {
            box-shadow: none;
            border-color: rgba(255,255,255,.1);
        }

        .accordion-body {
            background-color: var(--card-dark);
        }

        /* Tables */
        .table-dark {
            --bs-table-bg: var(--card-dark);
            --bs-table-border-color: var(--border-dark);
            margin-bottom: 0;
        }

        .table {
            border-collapse: separate;
            border-spacing: 0 5px;
        }

        /* Status Badge */
        .status-badge {
            font-size: 0.85rem;
            padding: 5px 10px;
            border-radius: 20px;
            background-color: #198754;
            color: white;
            display: inline-block;
        }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(
                110deg,
                #1a2234 8%,
                #2c364c 18%,
                #1a2234 33%
            );
            background-size: 200% 100%;
            border-radius: 5px;
            animation: shine 1.5s linear infinite;
        }

        @keyframes shine {
            to {
                background-position-x: -200%;
            }
        }

        .footer-text {
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

        <div>
            <h2 class="mb-1">🧾 Sales History</h2>
            <p class="text-secondary mb-0">
                Reviewing all transactions for
                <strong>{{ session.get('shop_name', 'My Shop') }}</strong>
            </p>
        </div>

        <div>
            <a
                href="{{ url_for('main.shop') }}"
                class="btn btn-outline-light me-2"
            >
                Back to Dashboard
            </a>

            <a
                href="{{ url_for('main.pos') }}"
                class="btn btn-warning text-dark fw-bold"
            >
                🛒 Open POS
            </a>
        </div>

    </div>

    <!-- Sales Container -->
    <div class="accordion" id="salesAccordion">

        <!-- Loading State -->
        <div id="loadingState" class="text-center py-5">

            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>

            <p class="mt-3 text-muted">
                Fetching transaction history...
            </p>

        </div>

    </div>

    <!-- Footer -->
    <p class="text-center footer-text mt-5 small">
        &copy;
        <span id="currentYear"></span>
        {{ session.get('shop_name', 'My Shop') }}
        Inventory System
    </p>

</div>

<!-- Configuration -->
<script>
    const SALES_CONFIG = {
        apiUrl: {{ url_for('main.get_sales_history_api') | tojson }},
        shopName: {{ session.get('shop_name', 'My Shop') | tojson }}
    };

    document.getElementById("currentYear").textContent =
        new Date().getFullYear();
</script>

<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Sales History Logic -->
<script src="{{ url_for('static', filename='js/sales_history.js') }}"></script>

</body>
</html>
