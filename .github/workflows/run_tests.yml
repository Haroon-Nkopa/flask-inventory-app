name: Run Tests

on:
  push:
    branches:
      - deploy2

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Optional: automatically caches your pip dependencies

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Added resend to the package list below
          pip install pytest flask flask-sqlalchemy flask-migrate flask-login blinker resend
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Run your test suite using pytest
      - name: Run test suite
        env:
          # Swapped out legacy SMTP settings for the required test API key
          RESEND_API_KEY: 're_mock_test_key_12345'
        run: |
          python -m pytest
