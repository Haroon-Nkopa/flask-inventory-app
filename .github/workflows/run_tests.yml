name: Run Tests

on:
  push:
    branches:
      - deploy2

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Optional: automatically caches your pip dependencies

      # 3. Install required software dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Run your test suite using pytest
      - name: Run test suite
        env:
          # Set mock config values so your app factory handles logging tests cleanly
          MAIL_SERVER: '://example.com'
          MAIL_PORT: 587
          MAIL_USERNAME: 'test-user'
          MAIL_PASSWORD: 'test-password'
          MAIL_USE_TLS: '1'
        run: |
          python -m pytest
